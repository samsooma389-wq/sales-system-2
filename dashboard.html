<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 20px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #007bff; color: white; }
    .btn { display: inline-block; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>لوحة التحكم - المبيعات</h1>
  <a href="sales.html" class="btn">اضافة مبيعات جديدة</a>
  
  <table id="salesTable">
    <thead>
      <tr>
        <th>#</th>
        <th>اسم المنتج</th>
        <th>السعر</th>
      </tr>
    </thead>
    <tbody>
      <!-- البيانات ح تجي هنا تلقائي -->
    </tbody>
  </table>

  <script>
    let sales = JSON.parse(localStorage.getItem('sales')) || [];
    let tbody = document.querySelector('#salesTable tbody');
    
    sales.forEach((sale, index) => {
      let row = `<tr>
        <td>${index + 1}</td>
        <td>${sale.product}</td>
        <td>${sale.price} جنيه</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  </script>
</body>
</html>
